# Runs the test suite on every push to master (and on pull requests), so a
# broken commit is caught when it lands - not weeks later on release day,
# which used to be the first time CI ran the tests (release.yml).
#
# NOTE: two jobs. Linux is where Docker/the Pi run; Windows is where the
# Windows installer's pieces only run (the tray icon on the real Win32 API,
# MediaGrab.exe's branding, the Inno Setup Pascal compiled with real ISCC) -
# on Linux those skip themselves. The repo is public, so standard
# GitHub-hosted runners cost no Actions minutes.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pinned for the same reason as the other workflows: CI should only
    # change when this file says so.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        # NOTE: one test reads a real 1-second clip with ffprobe (skipped
        # without it) - the only check that our ffprobe query matches what
        # ffprobe actually returns.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # NOTE: no network needed; Node.js (preinstalled on the runner) runs
        # the app.js tests.
        run: pytest

  test-windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # NOTE: the embedded Python's version (packaging/build_windows.py).
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Inno Setup
        # NOTE: pinned + SHA256-checked; the installer-script tests compile
        # small harness setups with it.
        shell: pwsh
        run: .github/scripts/install-inno.ps1

      - name: Run tests
        run: pytest
