# Runs the test suite on every push to master (and on pull requests), so a
# broken commit is caught when it lands - not weeks later on release day,
# which used to be the first time CI ran the tests (release.yml).
#
# NOTE: Linux on purpose. release.yml already runs the same suite on Windows
# for every release, and the Windows-only bits (Tk wizard pages, the PATH
# registry) skip themselves here. The repo is public, so standard
# GitHub-hosted runners cost no Actions minutes.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pinned for the same reason as the other workflows: CI should only
    # change when this file says so.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        # NOTE: one test reads a real 1-second clip with ffprobe (skipped
        # without it) - the only check that our ffprobe query matches what
        # ffprobe actually returns.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # NOTE: no network needed; Node.js (preinstalled on the runner) runs
        # the app.js tests.
        run: pytest
