# Builds the Docker image and, on a version tag, publishes it as a
# multi-arch (amd64 + arm64) image to ghcr.io/<owner>/mediagrab.
#
# arm64 is built for Raspberry Pi users (see V2_PLANNING.md's Docker
# section) - zeroconf ships a manylinux aarch64 wheel, so this is a normal
# cross-build, not a from-source compile.
name: Docker

on:
  push:
    tags: ["v*"]
  # NOTE: lets the Dockerfile be exercised from the Actions tab without
  # cutting a release, so a broken build is found before tag day - mirrors
  # release.yml's own workflow_dispatch. Run from a BRANCH it stops at the
  # smoke test and never pushes. Run from a version TAG (the "Use workflow
  # from" picker) it rebuilds that release on today's base image and
  # re-publishes it - the manual way to refresh base-image security fixes
  # between releases (see CONTRIBUTING.md's release checklist).
  workflow_dispatch:

permissions:
  contents: read
  packages: write # required to push to ghcr.io

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mediagrab

jobs:
  build:
    # NOTE: pinned rather than ubuntu-latest - that label moves to Ubuntu 26
    # from 2026-10-19 (actions/runner-images#14748), and a release build
    # shouldn't change base OS by surprise. Bump this deliberately.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        # NOTE: lets this amd64 runner build the arm64 half of the image.
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build a single-platform image for the smoke test
        # NOTE: built and loaded into the local Docker daemon (not pushed)
        # first, so a broken Dockerfile is caught before any multi-arch build
        # or registry push - mirrors release.yml's "smoke-test before
        # publish" pattern.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mediagrab:smoke-test

      - name: Smoke-test the image
        # NOTE: a real container start, not just "did the build succeed" -
        # catches a Dockerfile that builds fine but fails at runtime (missing
        # ffmpeg/ffprobe/Deno, a broken CMD, a password that doesn't log in).
        # Mirrors release.yml's exe smoke test. See the script for the steps.
        run: bash .github/scripts/smoke-docker.sh mediagrab:smoke-test 8420

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push the multi-arch image
        # NOTE: only runs on a version tag - a workflow_dispatch run stops at
        # the smoke test above and never touches the registry.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
