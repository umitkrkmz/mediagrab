# Builds the Windows installer (MediaGrabSetup.exe) and publishes it whenever a
# version tag is pushed.
#
# Since v2.4.0 the installer is self-contained: packaging/build_windows.py
# stages an embedded Python with every requirement, MediaGrab itself and FFmpeg
# (each download pinned and SHA256-checked), and Inno Setup turns that into one
# exe (packaging/mediagrab.iss). The old Tk installer is gone.
#
# NOTE: the exe isn't byte-reproducible (timestamps), so its SHA256 is computed
# here and written into the release notes - the README points there.
name: Release

on:
  push:
    tags: ["v*"]
  # NOTE: lets the build (and its smoke test) be exercised from the Actions
  # tab without cutting a release, so a broken workflow is found before tag day.
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload the files

jobs:
  build:
    # NOTE: pinned rather than windows-latest for the same reason docker.yml
    # pins its runner: the exe should only change when this file says so.
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # NOTE: must match the embedded Python's minor version (cp314 wheels
          # are staged for it) - build_windows.py refuses anything else.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Inno Setup
        shell: pwsh
        run: .github/scripts/install-inno.ps1

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          # NOTE: a tag must match mediagrab/__init__.py exactly (test_version
          # also checks CHANGELOG.md); a manual run builds whatever is there.
          $code = (Select-String -Path mediagrab/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}".Substring(1)
            if ($tag -ne $code) { throw "tag v$tag doesn't match __version__ $code" }
          }
          "version=$code" >> $env:GITHUB_OUTPUT
          Write-Host "version $code"

      - name: Run tests
        # NOTE: no release goes out on a red suite. Inno Setup is installed by
        # now, so the installer-script tests (real ISCC) run here too.
        run: pytest

      - name: Stage the package
        run: python packaging/build_windows.py

      - name: Build the installer
        shell: pwsh
        run: |
          ISCC.exe /Q "/DAppVersion=${{ steps.version.outputs.version }}" /DOutputName=MediaGrabSetup packaging/mediagrab.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Smoke-test the installer
        # NOTE: silent install -> start MediaGrab -> it answers, uses its own
        # FFmpeg, knows it's a Windows install -> silent uninstall.
        shell: pwsh
        run: .github/scripts/smoke-windows.ps1 dist/MediaGrabSetup.exe ${{ steps.version.outputs.version }}

      - name: Fetch FFmpeg's source for the release
        # NOTE: FFmpeg is GPL and the installer distributes it - its exact
        # source (and the scripts that built it) go up next to the exe.
        run: python packaging/build_windows.py --sources dist/sources

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/MediaGrabSetup.exe -Algorithm SHA256).Hash.ToLower()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $sha"

      - name: Upload the installer as a workflow artifact
        # NOTE: makes a manual (workflow_dispatch) build downloadable from the
        # run page, so the exe can be tried by hand BEFORE a tag turns it into
        # a public release. Kept on tag builds too - it's the same file.
        uses: actions/upload-artifact@v7
        with:
          name: MediaGrabSetup-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/MediaGrabSetup.exe
          if-no-files-found: error

      - name: Publish the release
        # NOTE: only a version tag publishes. A manual run stops at the
        # artifact above; without this guard the step fails for lack of a tag.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/MediaGrabSetup.exe
            dist/sources/*
          generate_release_notes: true
          body: |
            ## Windows: MediaGrabSetup.exe

            Download **MediaGrabSetup.exe** below and run it — no Python, Git or ffmpeg needed. If Windows says "Windows protected your PC", click **More info → Run anyway** (the installer isn't code-signed yet). Full instructions: [README](https://github.com/umitkrkmz/mediagrab#readme)

            **SHA256**
            ```
            ${{ steps.hash.outputs.sha }}  MediaGrabSetup.exe
            ```
            Verify in PowerShell: `Get-FileHash .\MediaGrabSetup.exe`

            **VirusTotal:** _added after the scan_

            The `ffmpeg-source-*` and `ffmpeg-builds-scripts-*` files are the source of the FFmpeg build shipped inside the installer (GPL). See the [changelog](https://github.com/umitkrkmz/mediagrab/blob/master/CHANGELOG.md) for what changed.
