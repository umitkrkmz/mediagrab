name: Hata bildirimi / Bug report
description: MediaGrab'de karşılaştığınız bir sorunu bildirin. / Report a problem you ran into with MediaGrab.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Önce kontrol edin / Check first:** Ayarlar → Sürüm Kontrolleri'nden yt-dlp güncellemesi var mı bakın. Bu projedeki sorunların büyük kısmı eski yt-dlp'den kaynaklanır (siteler sık değişir).
        Please check Settings → Version Checks for a yt-dlp update first — most issues here come from an outdated yt-dlp (sites change often).

  - type: checkboxes
    id: checked-update
    attributes:
      label: yt-dlp güncel mi? / Is yt-dlp up to date?
      options:
        - label: Ayarlar sayfasından güncel olduğunu doğruladım. / I confirmed it's current from the Settings page.

  - type: textarea
    id: what-happened
    attributes:
      label: Ne oldu? / What happened?
      description: Beklediğiniz ile gerçekte olan arasındaki farkı anlatın. / Describe what you expected versus what actually happened.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Hangi link/site? (varsa) / Which link/site? (if applicable)
      description: Videonun kendisi değil, hangi SİTE olduğu yeterli (ör. YouTube, SoundCloud). / The site is enough (e.g. YouTube, SoundCloud) — not the video itself.

  - type: textarea
    id: error-text
    attributes:
      label: Tam hata mesajı / Full error message
      description: |
        Arayüzde görünen kırmızı hata metnini olduğu gibi yapıştırın. MediaGrab hiç açılmıyorsa Windows kurulum programında günlük dosyası `%LOCALAPPDATA%\MediaGrab\mediagrab.log`'dur.
        Paste the red error text shown in the UI, verbatim. If MediaGrab doesn't start at all, the Windows installer's log file is `%LOCALAPPDATA%\MediaGrab\mediagrab.log`.
      render: text

  - type: input
    id: os
    attributes:
      label: İşletim sistemi / OS
      placeholder: "Windows 11, macOS 14, Ubuntu 24.04 ..."
    validations:
      required: true

  - type: input
    id: install-method
    attributes:
      label: Kurulum yöntemi / Install method
      placeholder: "MediaGrabSetup.exe (normal / Docker), docker compose, git clone + pip"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Tanılama bilgisi / Diagnostic info
      description: |
        Ayarlar → Geri Bildirim → "Tanılama bilgisini kopyala" ile kopyalayıp yapıştırın (sürümler, işletim sistemi, kurulum türü; dosya yolu, IP adresi veya çerez içermez).
        Copy it with Settings → Feedback → "Copy diagnostic info" and paste it here (versions, OS, install type; no file paths, IP addresses or cookies).
      render: text

  - type: input
    id: ytdlp-version
    attributes:
      label: yt-dlp sürümü / yt-dlp version
      description: Ayarlar sayfasında yazıyor. / Shown on the Settings page.
    validations:
      required: true
