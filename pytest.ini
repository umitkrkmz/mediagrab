[pytest]
testpaths = tests
# NOTE: puts the project root on sys.path so `import mediagrab` works when the
# suite is run as a bare `pytest`. Without it only `python -m pytest` worked
# (that form adds the cwd itself), so the command the README gives failed with
# ModuleNotFoundError - which is exactly how CI caught it.
pythonpath = .
# NOTE: nothing in the suite touches the network or spawns yt-dlp, so the whole
# run finishes in a couple of seconds and works offline.
addopts = -q
