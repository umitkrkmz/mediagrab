{% extends "base.html" %}
{% block title %}{{ ui.title_history }}{% endblock %}
{% block main_class %}main-wide{% endblock %}
{% block content %}

<div class="page-title-row">
  <h1 id="history-page-title">{{ ui.history_page_title }}</h1>
  <button type="button" id="history-clear-btn" class="clear-history-btn hidden">{{ ui.history_clear }}</button>
</div>
<div class="history-filter-row">
  <input type="text" id="history-search" placeholder="{{ ui.history_search_placeholder }}" autocomplete="off" aria-label="{{ ui.history_search_placeholder }}">
  <select id="history-channel-filter" aria-label="{{ ui.history_all_channels }}">
    <option value="">{{ ui.history_all_channels }}</option>
  </select>
  <select id="history-type-filter" aria-label="{{ ui.history_type_filter_label }}">
    <option value=""></option>
  </select>
  <div class="history-view-toggle" role="group" aria-label="{{ ui.history_view_grid }} / {{ ui.history_view_list }}">
    <button type="button" id="history-view-grid" data-view="grid" title="{{ ui.history_view_grid }}" aria-label="{{ ui.history_view_grid }}">⊞</button>
    <button type="button" id="history-view-list" data-view="list" title="{{ ui.history_view_list }}" aria-label="{{ ui.history_view_list }}">☰</button>
  </div>
</div>
<div id="history-error" class="error hidden" role="alert"></div>
<div id="history-list" class="history-grid"></div>

{% endblock %}
