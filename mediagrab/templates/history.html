{% extends "base.html" %}
{% block title %}İndirme Geçmişi — MediaGrab{% endblock %}
{% block main_class %}main-wide{% endblock %}
{% block content %}

<div class="page-title-row">
  <h1 id="history-page-title">İndirme Geçmişi</h1>
  <button type="button" id="history-clear-btn" class="clear-history-btn hidden">Tümünü Sil</button>
</div>
<div class="history-filter-row">
  <input type="text" id="history-search" placeholder="Ara..." autocomplete="off">
  <select id="history-channel-filter">
    <option value="">Tüm kanallar</option>
  </select>
</div>
<div id="history-error" class="error hidden"></div>
<div id="history-list" class="history-grid"></div>

{% endblock %}
