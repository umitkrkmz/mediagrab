<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MediaGrab{% endblock %}</title>
<script>
// NOTE: inline and BEFORE the stylesheet on purpose - an explicitly chosen
// theme has to be on <html> before the first paint, otherwise a light-theme
// user sees a dark flash on every page load (the same class of bug the
// server-rendered language text fixes). No stored choice = no attribute =
// the CSS follows the OS via prefers-color-scheme.
(function () {
  try {
    var t = localStorage.getItem("mediagrab_theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#5b8def">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/?lang={{ lang }}">
      <span class="brand-mark">M</span>
      <span class="brand-name">MediaGrab</span>
    </a>
    <nav class="site-nav">
      <a href="/?lang={{ lang }}" id="nav-home" class="{{ 'active' if active == 'home' else '' }}" aria-current="{{ 'page' if active == 'home' else 'false' }}">{{ ui.nav_home }}</a>
      <a href="/history?lang={{ lang }}" id="nav-history" class="{{ 'active' if active == 'history' else '' }}" aria-current="{{ 'page' if active == 'history' else 'false' }}">{{ ui.nav_history }}</a>
      <a href="/channels?lang={{ lang }}" id="nav-channels" class="{{ 'active' if active == 'channels' else '' }}" aria-current="{{ 'page' if active == 'channels' else 'false' }}">{{ ui.nav_channels }}</a>
      <a href="/supported-sites?lang={{ lang }}" id="nav-sites" class="{{ 'active' if active == 'sites' else '' }}" aria-current="{{ 'page' if active == 'sites' else 'false' }}">{{ ui.nav_sites }}</a>
      <a href="/settings?lang={{ lang }}" id="nav-settings" class="{{ 'active' if active == 'settings' else '' }}" aria-current="{{ 'page' if active == 'settings' else 'false' }}">{{ ui.nav_settings }}</a>
    </nav>
    <button type="button" id="theme-toggle" class="theme-toggle" title="{{ ui.theme_toggle }}" aria-label="{{ ui.theme_toggle }}"></button>
    <div class="lang-switch" id="lang-switch" role="group" aria-label="{{ ui.lang_switch_label }}">
      <button type="button" data-lang="tr" class="{{ 'active' if lang == 'tr' else '' }}" aria-pressed="{{ 'true' if lang == 'tr' else 'false' }}">TR</button>
      <button type="button" data-lang="en" class="{{ 'active' if lang == 'en' else '' }}" aria-pressed="{{ 'true' if lang == 'en' else 'false' }}">EN</button>
    </div>
  </div>
</header>

<main class="site-main {% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>

<div id="download-dock" class="download-dock hidden" role="region" aria-live="polite" aria-label="{{ ui.downloads_panel }}"></div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <p id="footer-legal">{{ ui.footer_legal }}</p>
    <p class="footer-meta"><span id="footer-note">{{ ui.footer_note }}</span></p>
  </div>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
